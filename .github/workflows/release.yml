name: Release

# Builds the Windows installer and update package, then publishes them as a
# GitHub release. Runs when a version tag (for example 1.5.3) is pushed.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Write party relay config
        # Party mode needs a relay URL. Set the RELAY_URL repository secret to
        # enable it; without it the build ships with party mode off.
        shell: pwsh
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: |
          Set-Content -Path party/network/relay_config.py -Value "RELAY_URL = `"$env:RELAY_URL`"" -Encoding utf8
      - name: Build executable and installer
        run: python scripts/build_all.py
      - name: Create update package
        run: python scripts/create_update_package.py
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem installer -Filter 'Parasite_Setup_*.exe') + @(Get-ChildItem installer -Filter 'update_package_*.zip')
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            Write-Host "Not a tag build: skipping release upload"
            exit 0
          }
          gh release create $env:TAG $files.FullName --title "Parasite $env:TAG" --notes "Parasite $env:TAG. Download Parasite_Setup_$env:TAG.exe and run it to install."
