name: Follow Rose releases

# Every few hours: if Rose has a release Parasite doesn't, or main has Parasite changes
# the latest Parasite release doesn't, rebuild Parasite (parasite/sync.py), test, build
# the installer and publish a Parasite release. Parasite's auto-update then delivers it.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      rose_tag:
        description: "Rose tag to build (empty = latest release)"
        required: false
        default: ""
      dry_run:
        description: "Build and test only: no push, no release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rose-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  ROSE_REPO: Alban1911/Rose

jobs:
  sync:
    name: Sync, build and release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write # push the synced source to main, publish the release
      issues: write # open a failure issue, close the ones a release resolves
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the Rose release to follow
        id: rose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.rose_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$ROSE_REPO" --json tagName --jq .tagName)
          fi
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Rose tag '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Parasite's own version (parasite/parasite_version.txt, e.g. 2.1). Once it is
          # released, a newer Rose release builds as the next one (2.1 -> 2.2).
          version=$(tr -d ' \r\n' < parasite/parasite_version.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Parasite version '$version'"
            exit 1
          fi
          # reason: why this run builds a new version. rose = a Rose release Parasite
          # hasn't built yet; commits = Parasite changes on main the release doesn't have.
          # Empty: v$version isn't released yet (raised by hand), build it as it is.
          skip=false
          reason=""
          previous=""
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            built_from=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
              | grep -oP "github.com/$ROSE_REPO/releases/tag/\K[0-9.]+" | head -1 || true)
            if [ "$built_from" != "$tag" ] && [ -z "$INPUT_TAG" ]; then
              reason=rose
            else
              # v$version already has this Rose release. Release again only if main has
              # commits v$version doesn't. The monthly keepalive commit (parasite/keepalive.txt)
              # and workflow/issue-template changes (.github/) change nothing that ships.
              if ! released=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" --jq .sha) \
                || ! git cat-file -e "$released^{commit}" 2> /dev/null; then
                echo "::error::Can't find the commit release v$version was built from"
                exit 1
              fi
              pending=$(git log --format='%h %s' "$released..HEAD" -- . \
                ':(exclude)parasite/keepalive.txt' ':(exclude).github')
              if [ -z "$pending" ]; then
                skip=true
              elif [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$built_from" ]; then
                echo "::warning::main has changes v$version doesn't, but v$version was built from Rose ${built_from:-?}, not $INPUT_TAG. Run without rose_tag to release them."
                skip=true
              else
                reason=commits
                echo "Parasite changes since v$version:"
                echo "$pending"
              fi
            fi
            if [ -n "$reason" ]; then
              previous="$version"
              version="${version%%.*}.$(( ${version#*.} + 1 ))"
              echo "$version" > parasite/parasite_version.txt
              if [ "$reason" = rose ]; then
                echo "Rose $tag is new: building Parasite v$version"
              else
                echo "main has Parasite changes v$previous doesn't: building Parasite v$version"
              fi
            fi
          fi
          {
            echo "version=$version"
            echo "previous=$previous"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Parasite v$version is already released and main has nothing new; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Following Rose $tag"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.rose.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Rebuild the Parasite tree from Rose
        if: steps.rose.outputs.skip == 'false'
        shell: bash
        env:
          TAG: ${{ steps.rose.outputs.tag }}
          VERSION: ${{ steps.rose.outputs.version }}
        run: |
          git fetch --no-tags "https://github.com/$ROSE_REPO.git" "refs/tags/$TAG:refs/rose/$TAG"
          python parasite/sync.py "refs/rose/$TAG"
          version=$(grep -oP '^APP_VERSION = "\K[^"]+' config.py)
          if [ "$version" != "$VERSION" ]; then
            echo "::error::Expected APP_VERSION $VERSION after syncing Rose $TAG, got $version"
            exit 1
          fi

      - name: Install dependencies
        if: steps.rose.outputs.skip == 'false'
        run: python -m pip install -r requirements.txt

      # The prebuilt PyInstaller bootloader is shared with countless other exes, malware
      # included, so antivirus engines distrust it. One compiled here doesn't carry that.
      - name: Compile PyInstaller's bootloader
        if: steps.rose.outputs.skip == 'false'
        shell: bash
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          version=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
          python -m pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$version"

      - name: Party relay config
        if: steps.rose.outputs.skip == 'false'
        shell: bash
        env:
          PARASITE_RELAY_URL: ${{ secrets.PARASITE_RELAY_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PARASITE_RELAY_WORKER: ${{ vars.PARASITE_RELAY_WORKER }}
        # Parasite's relay (parasite/relay): from the secret or the Cloudflare account; without
        # either, write_config.py falls back to the relay Lust runs (skin sharing stays on)
        run: python parasite/relay/write_config.py

      - name: Plugins (JS syntax)
        if: steps.rose.outputs.skip == 'false'
        shell: bash
        run: git ls-files -z 'Pengu Loader/plugins/*.js' | xargs -0 -n1 node --check

      - name: Unit tests
        if: steps.rose.outputs.skip == 'false'
        shell: pwsh
        run: |
          $suites = @('test') + (Get-ChildItem -Directory | ForEach-Object { Join-Path $_.Name 'tests' } | Where-Object { Test-Path $_ })
          $failed = @()
          foreach ($suite in $suites) {
            python -m unittest discover -s $suite -t .
            if ($LASTEXITCODE -ne 0) { $failed += $suite }
          }
          if ($failed) { Write-Host "::error::Failing suites: $($failed -join ', ')"; exit 1 }

      - name: Install Inno Setup
        if: steps.rose.outputs.skip == 'false'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Parasite.exe, installer and update package
        if: steps.rose.outputs.skip == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.rose.outputs.version }}
        run: |
          python scripts/build_all.py
          python scripts/create_update_package.py
          test -f "installer/Parasite_Setup_$VERSION.exe"
          test -f "installer/update_package_$VERSION.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.rose.outputs.skip == 'false'
        with:
          name: parasite-${{ steps.rose.outputs.version }}
          path: installer/
          retention-days: 14

      # Main can move during the build (keepalive, a push): merge it in rather than rebase,
      # so the release can point at the commit that was built (BUILT) and main's newer
      # commits stay outside it, for the next run to release.
      - name: Commit the synced source
        id: commit
        if: steps.rose.outputs.skip == 'false' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rose.outputs.tag }}
          VERSION: ${{ steps.rose.outputs.version }}
          REASON: ${{ steps.rose.outputs.reason }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The build regenerates the icon; only the synced source belongs in the commit
          git restore assets/icon.ico 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "Source already matches Rose $TAG"
          elif [ "$REASON" = commits ]; then
            git commit -q -m "Release Parasite $VERSION"
          else
            git commit -q -m "Sync with Rose $TAG"
          fi
          built=$(git rev-parse HEAD)
          echo "built=$built" >> "$GITHUB_OUTPUT"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            git fetch -q --no-tags "$remote" main
            if git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "main already has $built"
              exit 0
            fi
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "main moved during the build: merging it in"
              if ! git merge -q --no-edit -m "Merge main into Parasite $VERSION" FETCH_HEAD; then
                git merge --abort || true
                echo "::error::main changed files this run changed too (conflict); nothing was pushed or released. Re-run the workflow."
                exit 1
              fi
            fi
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            echo "Push $attempt failed; trying again"
            git reset -q --hard "$built"
            sleep $(( attempt * 15 ))
          done
          echo "::error::Could not push to main after 5 attempts; nothing was released"
          exit 1

      - name: Publish the Parasite release
        if: steps.rose.outputs.skip == 'false' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rose.outputs.tag }}
          VERSION: ${{ steps.rose.outputs.version }}
          PREVIOUS: ${{ steps.rose.outputs.previous }}
          BUILT: ${{ steps.commit.outputs.built }}
        run: |
          name="Parasite $VERSION"
          # Read from the built commit: a merge of a newer main may have changed the tree
          news=$(git show "$BUILT:Pengu Loader/plugins/PARASITE-News/whats-new.json" 2>/dev/null || true)
          changes=""
          if [ -n "$news" ] && [ "$(jq -r .version <<< "$news")" = "$VERSION" ]; then
            changes="**What's new**
          $(jq -r '.en[] | "- " + .' <<< "$news")
          "
          fi
          if [ -n "$PREVIOUS" ]; then
            changes="$changes
          Changes since v$PREVIOUS: https://github.com/$GITHUB_REPOSITORY/compare/v$PREVIOUS...v$VERSION
          "
          fi
          notes="$name, built from [Rose $TAG](https://github.com/$ROSE_REPO/releases/tag/$TAG).

          $changes
          **Install:** download \`Parasite_Setup_$VERSION.exe\` below. Existing installs update themselves."
          gh release create "v$VERSION" \
            "installer/Parasite_Setup_$VERSION.exe" \
            "installer/update_package_$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILT" \
            --title "$name" \
            --notes "$notes"

      # A failure issue is resolved once Parasite is released from that Rose release or a
      # newer one: now (published), or already (nothing to do on a scheduled run).
      - name: Close the failure issues this resolves
        if: success() && inputs.dry_run != true && (steps.rose.outputs.skip == 'false' || inputs.rose_tag == '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rose.outputs.tag }}
          VERSION: ${{ steps.rose.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search '"Automatic update to Rose" in:title author:app/github-actions' \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"'); then
            echo "::warning::Could not list the failure issues"
            exit 0
          fi
          while IFS=$'\t' read -r number title; do
            [ -n "$number" ] || continue
            failed=$(sed -nE 's/^Automatic update to Rose ([0-9.]+|\?) failed$/\1/p' <<< "$title")
            [ -n "$failed" ] || continue
            if [ "$failed" != "?" ] && [ "$(printf '%s\n%s\n' "$failed" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
              continue
            fi
            echo "Closing #$number ($title)"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "Resolved: Parasite v$VERSION is released, built from Rose $TAG. Run: $RUN_URL" \
              || echo "::warning::Could not close #$number"
          done <<< "$issues"

      - name: Report the failure as an issue
        if: failure() && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rose.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automatic update to Rose ${TAG:-?} failed"
          if [ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            echo "An issue is already open for this"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Nothing was released; users stay on the previous Parasite version.

          Run log: $RUN_URL

          Most likely Rose changed code that parasite/sync.py edits. Fix parasite/sync.py (or parasite/overlay), push, then re-run this workflow."
