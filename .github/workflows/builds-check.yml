# PARASITE-Theme and Parasite Offline are generated by scripts from pinned upstream
# releases (parasite/elaina_version.txt, parasite/deceive_version.txt). This rebuilds both
# and fails if the result differs from what is committed: a script changed without
# regenerating, or a patch no longer applies. Images and exes are left out of the
# comparison, since they aren't byte-identical across machines.
name: Builds check

on:
  push:
    branches: [main]
    paths:
      - "parasite/theme/**"
      - "parasite/offline/build_offline.py"
      - "parasite/elaina_version.txt"
      - "parasite/deceive_version.txt"
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  theme:
    name: PARASITE-Theme from Elaina
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rebuild the theme
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pillow
          tag=$(tr -d '[:space:]' < parasite/elaina_version.txt)
          mkdir -p "$RUNNER_TEMP/elaina"
          gh release download "$tag" --repo Elaina69/Elaina-theme --pattern ElainaV4.zip --dir "$RUNNER_TEMP/elaina"
          curl -fsSL -o "$RUNNER_TEMP/elaina/data.tgz" \
            "https://registry.npmjs.org/elaina-theme-data/-/elaina-theme-data-${tag#v}.tgz"
          python parasite/theme/build_theme.py "$RUNNER_TEMP/elaina/ElainaV4.zip" "$RUNNER_TEMP/elaina/data.tgz"
      - name: Compare with the committed theme
        shell: bash
        run: |
          git diff --exit-code --stat -- "parasite/overlay/Pengu Loader/plugins/PARASITE-Theme" \
            ':(exclude)*.jpg' ':(exclude)*.png' ':(exclude)*.gif' ':(exclude)*.wav'

  offline:
    name: Parasite Offline from Deceive
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rebuild Parasite Offline
        shell: bash
        run: |
          tag=$(tr -d '[:space:]' < parasite/deceive_version.txt)
          git clone --quiet --depth 1 --branch "$tag" https://github.com/molenzwiebel/Deceive.git "$RUNNER_TEMP/Deceive"
          python parasite/offline/build_offline.py "$RUNNER_TEMP/Deceive"
      - name: Compare with the committed source
        shell: bash
        run: git diff --exit-code --stat -- parasite/offline/src ':(exclude)*.ico'
