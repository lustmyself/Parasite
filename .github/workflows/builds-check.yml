# PARASITE-Theme and Parasite Offline are generated by scripts from pinned upstream
# releases (parasite/elaina_version.txt, parasite/deceive_version.txt). This rebuilds both
# and fails if the result differs from what is committed: a script changed without
# regenerating, or a patch no longer applies. Theme images are left out of the comparison,
# since they aren't byte-identical across machines.
#
# ParasiteOffline.exe (GPL-3.0, from Deceive) must be built from the committed
# parasite/offline/src, which is its corresponding source. Its build is deterministic
# (parasite/offline: Directory.Build.props, global.json, packages.lock.json), so the job
# rebuilds it on Windows and requires the committed exe to be byte-identical. The CI-built
# exe is uploaded as an artifact either way; when the check fails, that artifact is the exe
# to commit.
name: Builds check

on:
  push:
    branches: [main]
    paths:
      - "parasite/theme/**"
      - "parasite/offline/**"
      - "parasite/overlay/injection/tools/ParasiteOffline.exe"
      - "injection/tools/ParasiteOffline.exe"
      - "parasite/elaina_version.txt"
      - "parasite/deceive_version.txt"
      - ".github/workflows/builds-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "parasite/theme/**"
      - "parasite/offline/**"
      - "parasite/overlay/injection/tools/ParasiteOffline.exe"
      - "injection/tools/ParasiteOffline.exe"
      - "parasite/elaina_version.txt"
      - "parasite/deceive_version.txt"
      - ".github/workflows/builds-check.yml"
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  theme:
    name: PARASITE-Theme from Elaina
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rebuild the theme
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pillow
          tag=$(tr -d '[:space:]' < parasite/elaina_version.txt)
          mkdir -p "$RUNNER_TEMP/elaina"
          gh release download "$tag" --repo Elaina69/Elaina-theme --pattern ElainaV4.zip --dir "$RUNNER_TEMP/elaina"
          curl -fsSL -o "$RUNNER_TEMP/elaina/data.tgz" \
            "https://registry.npmjs.org/elaina-theme-data/-/elaina-theme-data-${tag#v}.tgz"
          python parasite/theme/build_theme.py "$RUNNER_TEMP/elaina/ElainaV4.zip" "$RUNNER_TEMP/elaina/data.tgz"
      - name: Compare with the committed theme
        shell: bash
        run: |
          git diff --exit-code --stat -- "parasite/overlay/Pengu Loader/plugins/PARASITE-Theme" \
            ':(exclude)*.jpg' ':(exclude)*.png' ':(exclude)*.gif' ':(exclude)*.wav'

  offline:
    name: Parasite Offline from Deceive
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      EXE: parasite/overlay/injection/tools/ParasiteOffline.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: parasite/offline/global.json
      - name: Build ParasiteOffline.exe from the committed source
        id: build
        shell: bash
        run: |
          dotnet --version
          python parasite/offline/build_offline.py --build-only
      - name: Upload the CI-built exe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ParasiteOffline-exe
          path: parasite/overlay/injection/tools/ParasiteOffline.exe
          if-no-files-found: error
          retention-days: 90
      - name: Compare with the committed exe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          committed=$(git cat-file blob "HEAD:$EXE" | sha256sum | cut -d' ' -f1)
          built=$(sha256sum "$EXE" | cut -d' ' -f1)
          {
            echo "### ParasiteOffline.exe"
            echo "- committed: \`$committed\`"
            echo "- built by CI from parasite/offline/src: \`$built\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # The synced copy at the top of the tree must be the same file.
          if [ "$(git rev-parse "HEAD:$EXE")" != "$(git rev-parse HEAD:injection/tools/ParasiteOffline.exe)" ]; then
            echo "::error file=injection/tools/ParasiteOffline.exe::differs from $EXE; run parasite/sync.py"
            exit 1
          fi
          if [ "$committed" != "$built" ]; then
            echo "::error file=$EXE::The committed ParasiteOffline.exe is not the build of parasite/offline/src (committed $committed, CI $built). Download the ParasiteOffline-exe artifact of this run, put it at $EXE (and injection/tools/ via sync), and commit it."
            exit 1
          fi
          echo "ParasiteOffline.exe matches the build of parasite/offline/src ($built)"
      - name: Regenerate the source from Deceive
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git checkout -- "$EXE"
          tag=$(tr -d '[:space:]' < parasite/deceive_version.txt)
          git clone --quiet --depth 1 --branch "$tag" https://github.com/molenzwiebel/Deceive.git "$RUNNER_TEMP/Deceive"
          python parasite/offline/build_offline.py --source-only "$RUNNER_TEMP/Deceive"
      - name: Compare with the committed source
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git status --short -- parasite/offline
          git diff --exit-code --stat -- parasite/offline/src
          test -z "$(git status --porcelain --untracked-files=all -- parasite/offline/src)"
